[project]
name = "horma"
version = "0.1.0"
description = "Asistente de búsqueda de empleo: agentes en Python con consola, API y worker."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pypdf>=7.1.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.33",
]

[project.scripts]
horma = "horma.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "import-linter>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["horma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bd: necesita Postgres en marcha (docker compose up -d postgres)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.importlinter]
root_package = "horma"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Solo horma.llm importa el SDK de Anthropic (RT-02)"
type = "forbidden"
source_modules = ["horma.schemas", "horma.agents", "horma.tools", "horma.flows", "horma.web", "horma.cli"]
forbidden_modules = ["anthropic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Los agentes no tocan BD, disco de la web ni otros agentes (RT-01, RT-13)"
type = "forbidden"
source_modules = ["horma.agents"]
forbidden_modules = ["horma.web", "sqlalchemy", "psycopg", "horma.flows"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Los agentes no se importan entre sí (RT-13)"
type = "independence"
modules = [
  "horma.agents.extractor_oferta",
  "horma.agents.auditor_oferta",
  "horma.agents.clasificador_oferta",
  "horma.agents.auditor_fuentes",
]

[[tool.importlinter.contracts]]
name = "Flujos y herramientas no tocan la BD ni la web (fase 1)"
type = "forbidden"
source_modules = ["horma.flows", "horma.tools"]
forbidden_modules = ["horma.web", "sqlalchemy", "psycopg"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "La consola y el ingestor pasan por la API, nunca por la BD (RF-1.2)"
type = "forbidden"
source_modules = ["horma.cli", "horma.ingesta"]
forbidden_modules = ["horma.web", "sqlalchemy", "psycopg"]

[tool.ruff.lint.per-file-ignores]
"horma/cli.py" = ["B008"]
